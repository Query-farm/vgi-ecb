{
  "tasks": [
    {
      "name": "datasets",
      "reference_sql": "SELECT flow, name FROM ecb.main.datasets(flow := 'EXR') ORDER BY flow"
    },
    {
      "name": "dimensions",
      "reference_sql": "SELECT dimension, position, codelist FROM ecb.main.dimensions('EXR') ORDER BY position NULLS LAST, dimension"
    },
    {
      "name": "codes",
      "reference_sql": "SELECT code, name FROM ecb.main.codes('CL_CURRENCY') WHERE code IN ('USD','EUR') ORDER BY code"
    },
    {
      "name": "series",
      "reference_sql": "SELECT series_key, title, unit FROM ecb.main.series('EXR', 'D.USD.EUR.SP00.A') ORDER BY series_key"
    },
    {
      "name": "observations",
      "reference_sql": "SELECT period, value, unit FROM ecb.main.observations('EXR', 'D.USD.EUR.SP00.A', start_period := '2024-01-02', end_period := '2024-01-05') ORDER BY period"
    },
    {
      "name": "currency_peaks",
      "reference_sql": "SELECT c.code AS currency, c.name AS currency_name, max(o.value) AS max_rate FROM ecb.main.observations('EXR', 'D.USD+JPY.EUR.SP00.A', start_period := '2024-01-02', end_period := '2024-01-31') AS o JOIN ecb.main.codes('CL_CURRENCY') AS c ON c.code = split_part(o.series_key, '.', 2) GROUP BY c.code, c.name ORDER BY c.code"
    }
  ]
}
